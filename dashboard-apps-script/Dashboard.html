<!DOCTYPE html>
<html lang="fr">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Tableau de bord · AUREN CRÉATIF</title>
  <style>
    :root { --bg:#f8fafc; --surface:#fff; --border:#e2e8f0; --text:#0f172a; --muted:#64748b; --primary:#2563eb; --soft:#dbeafe; --warn:#b45309; --warn-soft:#fef3c7; --ok:#047857; --ok-soft:#d1fae5; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b1120; --surface:#111827; --border:#1f2937; --text:#e5e7eb; --muted:#94a3b8; --primary:#60a5fa; --soft:#1e3a8a; --warn:#fbbf24; --warn-soft:#422006; --ok:#34d399; --ok-soft:#064e3b; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:1rem 16px; background:var(--surface); border-bottom:1px solid var(--border); }
    h1 { font-size:1.1rem; margin:0; }
    main { max-width:1150px; margin:0 auto; padding:1.25rem 16px 3rem; }
    .muted { color:var(--muted); }
    button, select, input, textarea { font:inherit; color:inherit; }
    .btn { border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:.5rem .85rem; cursor:pointer; }
    .btn-primary { background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600; }
    .btn[disabled] { opacity:.6; cursor:wait; }
    .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:.75rem; margin-bottom:1.25rem; }
    .tile { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1rem; }
    .tile .label { color:var(--muted); font-size:.8rem; } .tile .value { font-size:1.5rem; font-weight:700; font-variant-numeric:tabular-nums; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1rem; }
    .filters { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:.75rem; }
    .filters input, .filters select { border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:.45rem .7rem; }
    .filters input { flex:1 1 220px; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:.55rem .5rem; border-bottom:1px solid var(--border); white-space:nowrap; }
    th { color:var(--muted); font-size:.78rem; } tbody tr { cursor:pointer; } tbody tr:hover { background:var(--bg); }
    .num { text-align:right; font-variant-numeric:tabular-nums; }
    .pill { display:inline-block; padding:.1rem .55rem; border-radius:999px; font-size:.75rem; background:var(--soft); }
    .pill.warn { background:var(--warn-soft); color:var(--warn); } .pill.ok { background:var(--ok-soft); color:var(--ok); }
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; } .overlay.open { display:block; }
    aside { position:fixed; top:0; right:0; bottom:0; width:min(560px,100%); background:var(--surface); border-left:1px solid var(--border); overflow-y:auto; padding:1.25rem 16px 2rem; transform:translateX(100%); transition:transform .2s; }
    aside.open { transform:none; }
    aside h3 { margin:0; font-size:1.2rem; } aside h4 { margin:1.4rem 0 .5rem; font-size:.92rem; }
    dl { display:grid; grid-template-columns:150px 1fr; gap:.3rem .75rem; margin:0; } dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; white-space:pre-wrap; }
    .row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
    aside select, aside input[type=file], aside textarea { border:1px solid var(--border); background:var(--bg); border-radius:8px; padding:.45rem .6rem; width:100%; }
    aside select { width:auto; } aside textarea { min-height:70px; }
    .deliver { background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:1rem; }
    .deliver label { display:block; font-weight:600; margin:.6rem 0 .3rem; }
    .files { margin:0; padding-left:1.1rem; } .files li { margin:.25rem 0; } .files a { color:var(--primary); }
    .notice { font-size:.78rem; color:var(--muted); margin:.5rem 0 0; }
    .empty { padding:2rem; text-align:center; color:var(--muted); }
    @media (max-width:560px) { dl { grid-template-columns:1fr; } }
    @media (prefers-reduced-motion: reduce) { aside { transition:none; } }
  </style>
</head>
<body>
  <header>
    <div><h1>Tableau de bord · AUREN CRÉATIF</h1><div class="muted" id="maj">Chargement…</div></div>
    <button class="btn" id="refresh">Actualiser</button>
  </header>
  <main>
    <section class="tiles" id="tiles"></section>
    <section class="card">
      <div class="filters">
        <input type="search" id="search" placeholder="Rechercher : référence, client, service…" aria-label="Rechercher">
        <select id="filterStatut" aria-label="Filtrer par statut"><option value="">Tous les statuts</option></select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Référence</th><th>Reçue le</th><th>Client</th><th>Service</th><th>Livraison prévue</th><th class="num">Total</th><th>Statut</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <div class="overlay" id="overlay"></div>
  <aside id="detail" aria-label="Détail de la commande"></aside>

  <script>
    const KEY = <?!= JSON.stringify(adminKey) ?>;
    let DATA = { commandes: [], statuts: [] };
    let filtre = '';
    const S = () => DATA.statuts;
    const fcfa = n => (Number(n) || 0).toLocaleString('fr-FR') + ' FCFA';
    const dateFr = v => v ? new Date(v).toLocaleDateString('fr-FR') : '—';
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const pill = s => s === S()[0] || s === S()[3] ? 'warn' : (s === S()[4] ? 'ok' : '');
    const run = (fn, ...args) => new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](KEY, ...args));

    async function charger() {
      document.getElementById('maj').textContent = 'Chargement…';
      try { afficher(await run('getDashboardData')); } catch (e) { alert(e.message); }
    }

    function afficher(data) {
      DATA = data;
      document.getElementById('maj').textContent = 'Mis à jour le ' + new Date(data.maj).toLocaleString('fr-FR');
      const sel = document.getElementById('filterStatut');
      if (sel.options.length === 1) data.statuts.forEach(s => sel.add(new Option(s, s)));
      const cs = data.commandes;
      const tuiles = [
        ['À vérifier (paiement)', cs.filter(c => c['Statut'] === S()[0]).length],
        ['À réaliser', cs.filter(c => c['Statut'] === S()[1] || c['Statut'] === S()[2]).length],
        ['Solde en attente', cs.filter(c => c['Statut'] === S()[3]).length],
        ['Livrées', cs.filter(c => c['Statut'] === S()[4]).length],
        ['Acomptes encaissés', fcfa(cs.filter(c => c['Date paiement 1/2']).reduce((s, c) => s + (Number(c['Acompte (FCFA)']) || 0), 0))]
      ];
      document.getElementById('tiles').innerHTML = tuiles.map(t => `<div class="tile"><div class="label">${t[0]}</div><div class="value">${t[1]}</div></div>`).join('');
      tableau();
      const ouvert = document.getElementById('detail');
      if (ouvert.classList.contains('open')) ouvrir(ouvert.dataset.ref);
    }

    function tableau() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const rows = DATA.commandes
        .filter(c => !filtre || c['Statut'] === filtre)
        .filter(c => !q || [c['Référence'], c['Nom'], c['Service'], c['E-mail'], c['WhatsApp']].join(' ').toLowerCase().includes(q))
        .sort((a, b) => new Date(b['Date']) - new Date(a['Date']));
      const tb = document.getElementById('rows');
      tb.innerHTML = rows.length ? rows.map(c => `<tr data-ref="${esc(c['Référence'])}">
        <td><strong>${esc(c['Référence'])}</strong></td><td>${dateFr(c['Date'])}</td><td>${esc(c['Nom'])}</td><td>${esc(c['Service'])}</td>
        <td>${dateFr(c['Livraison prévue'])}</td><td class="num">${fcfa(c['Total (FCFA)'])}</td><td><span class="pill ${pill(c['Statut'])}">${esc(c['Statut'])}</span></td></tr>`).join('')
        : '<tr><td colspan="7" class="empty">Aucune commande.</td></tr>';
      tb.querySelectorAll('tr[data-ref]').forEach(tr => tr.onclick = () => ouvrir(tr.dataset.ref));
    }

    const lireFichier = f => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok({ name: f.name, type: f.type || 'application/octet-stream', data: String(r.result).split(',')[1] }); r.onerror = ko; r.readAsDataURL(f); });

    function ouvrir(ref) {
      const c = DATA.commandes.find(x => x['Référence'] === ref);
      if (!c) return;
      const p = document.getElementById('detail');
      p.dataset.ref = ref;
      const tel = String(c['WhatsApp'] || '').replace(/\D/g, '');
      const brief = ['Projet', 'Utilisation', 'Textes', 'Style', 'Dimensions', 'Infos'];
      const fichiers = String(c['Lien fichiers client'] || '').split('\n').filter(Boolean).map(l => { const [nom, url] = l.split(' | '); return { nom, url: url || nom }; });
      const livre = c['Statut'] === S()[4];
      p.innerHTML = `
        <div class="row" style="justify-content:space-between"><div><h3>${esc(ref)}</h3><div class="muted">${esc(c['Service'])} · reçue le ${dateFr(c['Date'])}</div></div><button class="btn" id="fermer" aria-label="Fermer">✕</button></div>

        <h4>Statut</h4>
        <div class="row"><select id="statut">${S().map(s => `<option ${s === c['Statut'] ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select><button class="btn" id="saveStatut">Enregistrer</button></div>
        <p class="notice">Les paiements Chariow mettent ce statut à jour automatiquement. Vous pouvez aussi le changer à la main.</p>

        <h4>📎 Fichiers envoyés par le client</h4>
        ${fichiers.length ? `<ul class="files">${fichiers.map(f => `<li><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.nom)}</a></li>`).join('')}</ul>` : '<p class="muted">Aucun fichier.</p>'}

        <h4>📤 Envoyer le projet au client</h4>
        ${livre ? `<p>✅ Fichiers finaux livrés le ${dateFr(c['Date paiement 2/2'])}.</p>` : `
        <div class="deliver">
          <label for="apercu">1. L’aperçu que le client va voir <span class="muted">(image avec filigrane)</span></label><input type="file" id="apercu" accept="image/*,application/pdf,video/*">
          <label for="final">2. Le fichier final <span class="muted">(gardé de côté, envoyé après le paiement)</span></label><input type="file" id="final">
          <label for="message">3. Un petit mot pour le client <span class="muted">(facultatif)</span></label><textarea id="message" placeholder="Ex. Voici votre affiche, dites-moi si une retouche est nécessaire."></textarea>
          <div class="row" style="margin-top:.8rem"><button class="btn btn-primary" id="envoyer">Envoyer au client</button></div>
          <p class="notice">Le client reçoit un e-mail avec l’aperçu et le bouton « Payer le solde ». Dès qu’il a payé, il reçoit automatiquement un second e-mail avec le fichier final.</p>
          ${c['ID fichier final'] ? `<div class="row" style="margin-top:.8rem"><button class="btn" id="livrer">Solde reçu → envoyer le fichier final maintenant</button></div>` : ''}
        </div>`}

        <h4>Client</h4>
        <dl><dt>Nom</dt><dd>${esc(c['Nom'])}</dd><dt>E-mail</dt><dd>${esc(c['E-mail'])}</dd><dt>WhatsApp</dt><dd>${esc(c['WhatsApp'])}</dd>
          <dt>Total</dt><dd>${fcfa(c['Total (FCFA)'])}</dd><dt>Acompte</dt><dd>${fcfa(c['Acompte (FCFA)'])} ${c['Date paiement 1/2'] ? '· payé le ' + dateFr(c['Date paiement 1/2']) : '· à vérifier'}</dd>
          <dt>Solde</dt><dd>${fcfa(c['Solde (FCFA)'])}</dd><dt>Livraison prévue</dt><dd>${dateFr(c['Livraison prévue'])} · ${esc(c['Délai'])}</dd></dl>
        <div class="row" style="margin-top:.7rem">${tel ? `<a class="btn" href="https://wa.me/${tel}" target="_blank" rel="noopener">WhatsApp</a>` : ''}${c['Dossier Drive'] ? `<a class="btn" href="${esc(c['Dossier Drive'])}" target="_blank" rel="noopener">Dossier Drive (fichiers du client)</a>` : ''}</div>

        <h4>Brief</h4>
        <dl>${brief.filter(k => c[k]).map(k => `<dt>${k}</dt><dd>${esc(c[k])}</dd>`).join('')}</dl>

        <h4>Notes internes</h4>
        <textarea id="notes">${esc(c['Notes'])}</textarea>
        <div class="row" style="margin-top:.4rem"><button class="btn" id="saveNotes">Enregistrer les notes</button></div>`;
      p.classList.add('open');
      document.getElementById('overlay').classList.add('open');

      const act = async (btn, fn, ...args) => { btn.disabled = true; try { afficher(await run(fn, ...args)); } catch (e) { alert(e.message); btn.disabled = false; } };
      document.getElementById('fermer').onclick = fermer;
      document.getElementById('saveStatut').onclick = e => act(e.target, 'setStatut', ref, document.getElementById('statut').value);
      document.getElementById('saveNotes').onclick = e => act(e.target, 'setNotes', ref, document.getElementById('notes').value);
      const envoyer = document.getElementById('envoyer');
      if (envoyer) envoyer.onclick = async () => {
        const a = document.getElementById('apercu').files[0], f = document.getElementById('final').files[0];
        if (!a || !f) { alert('Ajoutez l’aperçu et le fichier final.'); return; }
        if (!confirm(`Envoyer l’aperçu à ${c['E-mail']} avec le lien du solde ?`)) return;
        envoyer.textContent = 'Envoi en cours…';
        act(envoyer, 'envoyerApercu', ref, await lireFichier(a), await lireFichier(f), document.getElementById('message').value);
      };
      const livrer = document.getElementById('livrer');
      if (livrer) livrer.onclick = () => confirm('Envoyer le fichier final au client maintenant ?') && act(livrer, 'livrerManuellement', ref);
    }

    function fermer() { document.getElementById('detail').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }
    document.getElementById('overlay').onclick = fermer;
    document.addEventListener('keydown', e => { if (e.key === 'Escape') fermer(); });
    document.getElementById('refresh').onclick = charger;
    document.getElementById('search').oninput = tableau;
    document.getElementById('filterStatut').onchange = e => { filtre = e.target.value; tableau(); };
    charger();
  </script>
</body>
</html>
