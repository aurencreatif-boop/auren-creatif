<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="100%" height="100%">
  <defs>
    <linearGradient id="psGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001E36" />
      <stop offset="100%" stop-color="#000F1D" />
    </linearGradient>
    <linearGradient id="aeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A002E" />
      <stop offset="100%" stop-color="#0D0017" />
    </linearGradient>
    <linearGradient id="psHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002D54" />
      <stop offset="100%" stop-color="#001830" />
    </linearGradient>
    <linearGradient id="aeHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D0052" />
      <stop offset="100%" stop-color="#190030" />
    </linearGradient>
    <filter id="shadowWindow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B192C" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="280" cy="240" r="240" fill="#31A8FF" opacity="0.1" filter="blur(70px)" />
  <circle cx="580" cy="360" r="220" fill="#9999FF" opacity="0.1" filter="blur(70px)" />
  <ellipse cx="410" cy="565" rx="360" ry="22" fill="#0F172A" opacity="0.2" />

  <!-- ZONE 1: Photoshop Window (.PSD) - Left / Top-slanted -->
  <g transform="translate(40, 50)" filter="url(#shadowWindow)">
    <!-- Main Window Frame -->
    <rect width="420" height="360" rx="14" fill="#0F172A" stroke="#31A8FF" stroke-width="2" />
    
    <!-- Window Header -->
    <rect width="420" height="42" rx="14" fill="url(#psHeader)" />
    <!-- Window buttons -->
    <circle cx="22" cy="21" r="5" fill="#EF4444" />
    <circle cx="38" cy="21" r="5" fill="#F59E0B" />
    <circle cx="54" cy="21" r="5" fill="#10B981" />
    
    <!-- PS Logo Badge -->
    <rect x="74" y="10" width="24" height="22" rx="4" fill="#001E36" stroke="#31A8FF" stroke-width="1.5" />
    <text x="86" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#31A8FF" text-anchor="middle">Ps</text>
    <text x="108" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">MODÈLES PHOTOSHOP (.PSD)</text>
    <text x="395" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B" text-anchor="end">Calques organisés</text>

    <!-- Canvas Preview Area -->
    <rect x="18" y="56" width="260" height="286" rx="8" fill="#1E293B" stroke="#334155" />
    <!-- Graphic Template Art inside canvas -->
    <rect x="28" y="66" width="240" height="266" rx="6" fill="#102A56" />
    <rect x="42" y="80" width="80" height="18" rx="4" fill="#2563EB" />
    <text x="82" y="93" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">FLYER / POST PRO</text>
    <text x="42" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">BOOSTE TA</text>
    <text x="42" y="154" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#60A5FA">COMMUNICATION</text>
    <rect x="42" y="172" width="212" height="70" rx="6" fill="#1E3A8A" opacity="0.6" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4,4" />
    <text x="148" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#93C5FD" text-anchor="middle">⚡ Smart Object : Insérez votre image</text>
    <rect x="42" y="258" width="100" height="26" rx="6" fill="#2563EB" />
    <text x="92" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">PERSONNALISABLE</text>

    <!-- Photoshop Layers Panel on Right -->
    <rect x="290" y="56" width="114" height="286" rx="8" fill="#0B1324" stroke="#1E293B" />
    <text x="300" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#94A3B8">CALQUES PSD</text>
    
    <!-- Layer row 1 -->
    <rect x="296" y="90" width="102" height="28" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
    <circle cx="308" cy="104" r="5" fill="#3B82F6" />
    <text x="320" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#F1F5F9">Titre &amp; Textes</text>

    <!-- Layer row 2 -->
    <rect x="296" y="124" width="102" height="28" rx="4" fill="#131F37" />
    <circle cx="308" cy="138" r="5" fill="#10B981" />
    <text x="320" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#CBD5E1">Photos (Smart)</text>

    <!-- Layer row 3 -->
    <rect x="296" y="158" width="102" height="28" rx="4" fill="#131F37" />
    <circle cx="308" cy="172" r="5" fill="#F59E0B" />
    <text x="320" y="176" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#CBD5E1">Éléments graphiques</text>

    <!-- Layer row 4 -->
    <rect x="296" y="192" width="102" height="28" rx="4" fill="#131F37" />
    <circle cx="308" cy="206" r="5" fill="#64748B" />
    <text x="320" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">Arrière-plans</text>

    <!-- PSD tag -->
    <rect x="296" y="296" width="102" height="34" rx="6" fill="#002447" stroke="#31A8FF" stroke-width="1" />
    <text x="347" y="316" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#31A8FF" text-anchor="middle">Fichiers 100% .PSD</text>
  </g>

  <!-- ZONE 2: After Effects Window (.AEP) - Overlapping Right / Bottom -->
  <g transform="translate(340, 200)" filter="url(#shadowWindow)">
    <!-- Main Window Frame -->
    <rect width="440" height="350" rx="14" fill="#090514" stroke="#9999FF" stroke-width="2" />

    <!-- Window Header -->
    <rect width="440" height="42" rx="14" fill="url(#aeHeader)" />
    <circle cx="22" cy="21" r="5" fill="#EF4444" />
    <circle cx="38" cy="21" r="5" fill="#F59E0B" />
    <circle cx="54" cy="21" r="5" fill="#10B981" />

    <!-- AE Logo Badge -->
    <rect x="74" y="10" width="24" height="22" rx="4" fill="#1A002E" stroke="#9999FF" stroke-width="1.5" />
    <text x="86" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#9999FF" text-anchor="middle">Ae</text>
    <text x="108" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">TEMPLATES AFTER EFFECTS (.AEP)</text>
    <text x="415" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#C084FC" text-anchor="end">Motion Design</text>

    <!-- Composition Preview Area -->
    <rect x="18" y="54" width="404" height="150" rx="8" fill="#130D24" stroke="#2E1065" />
    <!-- Motion Preview Content -->
    <rect x="28" y="64" width="384" height="130" rx="6" fill="#1E1238" />
    <!-- Dynamic Graphic / Wave / Motion title -->
    <circle cx="220" cy="120" r="45" fill="#9333EA" opacity="0.3" filter="blur(15px)" />
    <path d="M 60 140 Q 140 80, 220 120 T 380 110" fill="none" stroke="#A855F7" stroke-width="3" stroke-linecap="round" />
    <text x="220" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">INTRO DYNAMIQUE &amp; TITRAGE</text>
    <rect x="160" y="142" width="120" height="20" rx="10" fill="#581C87" />
    <text x="220" y="156" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#E9D5FF" text-anchor="middle">4K / 1080p · 60 FPS</text>

    <!-- Keyframe Timeline Area -->
    <rect x="18" y="214" width="404" height="120" rx="8" fill="#0D071A" stroke="#2E1065" />
    <!-- Timeline Ruler -->
    <line x1="26" y1="230" x2="414" y2="230" stroke="#3B1D6E" stroke-width="1" />
    <text x="30" y="226" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#93C5FD">00:00</text>
    <text x="140" y="226" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B">00:05</text>
    <text x="250" y="226" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B">00:10</text>
    <text x="360" y="226" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748B">00:15</text>
    <!-- Playhead line -->
    <line x1="180" y1="220" x2="180" y2="324" stroke="#A855F7" stroke-width="2" />
    <polygon points="175,220 185,220 180,227" fill="#A855F7" />

    <!-- Timeline Layer 1: Text Animation -->
    <rect x="28" y="238" width="90" height="22" rx="4" fill="#251242" />
    <text x="34" y="253" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#C084FC">Text Animator</text>
    <rect x="126" y="240" width="180" height="18" rx="4" fill="#7E22CE" opacity="0.8" />
    <!-- Keyframe diamonds -->
    <polygon points="140,249 144,245 148,249 144,253" fill="#FDE047" />
    <polygon points="210,249 214,245 218,249 214,253" fill="#FDE047" />
    <polygon points="290,249 294,245 298,249 294,253" fill="#FDE047" />

    <!-- Timeline Layer 2: Lower Third / Logo -->
    <rect x="28" y="266" width="90" height="22" rx="4" fill="#251242" />
    <text x="34" y="281" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#C084FC">Logo Stinger</text>
    <rect x="180" y="268" width="160" height="18" rx="4" fill="#3B82F6" opacity="0.8" />
    <polygon points="195,277 199,273 203,277 199,281" fill="#FDE047" />
    <polygon points="320,277 324,273 328,277 324,281" fill="#FDE047" />

    <!-- Timeline Layer 3: Audio Track Waveform -->
    <rect x="28" y="294" width="90" height="22" rx="4" fill="#251242" />
    <text x="34" y="309" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#10B981">Sound FX</text>
    <rect x="126" y="296" width="280" height="18" rx="4" fill="#065F46" opacity="0.6" />
    <!-- Fake waveform bars -->
    <g fill="#34D399" opacity="0.8">
      <rect x="135" y="302" width="2" height="6" />
      <rect x="142" y="300" width="2" height="10" />
      <rect x="150" y="298" width="2" height="14" />
      <rect x="158" y="301" width="2" height="8" />
      <rect x="166" y="299" width="2" height="12" />
      <rect x="174" y="303" width="2" height="4" />
      <rect x="182" y="297" width="2" height="16" />
      <rect x="190" y="299" width="2" height="12" />
      <rect x="198" y="301" width="2" height="8" />
      <rect x="206" y="300" width="2" height="10" />
      <rect x="214" y="298" width="2" height="14" />
      <rect x="222" y="302" width="2" height="6" />
    </g>
  </g>

  <!-- Clear Disclaimer Pill at bottom left -->
  <g transform="translate(45, 520)" filter="url(#shadowWindow)">
    <rect width="360" height="48" rx="10" fill="#102A56" stroke="#2563EB" stroke-width="1.5" />
    <circle cx="26" cy="24" r="10" fill="#2563EB" />
    <text x="26" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">i</text>
    <text x="46" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Modèles prêts à l'emploi (.PSD &amp; .AEP)</text>
    <text x="46" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#93C5FD">Les logiciels Adobe Photoshop &amp; AE ne sont pas fournis.</text>
  </g>
</svg>
