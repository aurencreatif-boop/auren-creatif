<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="videoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="capcutAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#102A56" flood-opacity="0.4" />
    </filter>
    <filter id="floatCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Ambient light -->
  <circle cx="360" cy="320" r="230" fill="#2563EB" opacity="0.12" filter="blur(70px)" />
  <circle cx="200" cy="480" r="150" fill="#00E5FF" opacity="0.08" filter="blur(60px)" />
  <ellipse cx="360" cy="600" rx="300" ry="18" fill="#0F172A" opacity="0.22" />

  <!-- LEFT FLOATING MODULE CARDS -->
  <!-- Card 1: Prise en main & cuts -->
  <g transform="translate(40, 110)" filter="url(#floatCardShadow)">
    <rect width="210" height="96" rx="14" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5" />
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#EAF1FF" />
    <path d="M 24 31 L 38 31 M 31 24 L 31 38" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
    <text x="58" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#2563EB" letter-spacing="1">MODULE 1</text>
    <text x="58" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#102A56">Prise en main CapCut</text>
    <text x="16" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#64748B">Importer ses rushs, régler les formats</text>
    <text x="16" y="83" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#64748B">9:16 et préparer sa timeline.</text>
  </g>

  <!-- Card 2: Rythme & Dynamisme -->
  <g transform="translate(20, 240)" filter="url(#floatCardShadow)">
    <rect width="220" height="96" rx="14" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5" />
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#EAF1FF" />
    <path d="M 23 35 L 29 23 L 34 30 L 40 23" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="58" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#2563EB" letter-spacing="1">MODULE 2</text>
    <text x="58" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#102A56">Cuts dynamiques &amp; Rythme</text>
    <text x="16" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#64748B">Supprimer les blancs, synchroniser</text>
    <text x="16" y="83" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#64748B">les coupes sur le beat musical.</text>
  </g>

  <!-- Card 3: 100% Smartphone -->
  <g transform="translate(45, 380)" filter="url(#floatCardShadow)">
    <rect width="200" height="74" rx="14" fill="#102A56" stroke="#2563EB" stroke-width="1.5" />
    <circle cx="34" cy="37" r="16" fill="#2563EB" />
    <text x="34" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">📱</text>
    <text x="60" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">100% sur Mobile</text>
    <text x="60" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#93C5FD">Aucun ordi requis</text>
  </g>

  <!-- RIGHT FLOATING CARDS -->
  <!-- Card 4: Sous-titres & Textes -->
  <g transform="translate(565, 150)" filter="url(#floatCardShadow)">
    <rect width="215" height="96" rx="14" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5" />
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#EAF1FF" />
    <text x="31" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#2563EB" text-anchor="middle">T</text>
    <text x="58" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#2563EB" letter-spacing="1">MODULE 3</text>
    <text x="58" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#102A56">Textes &amp; Sous-titres</text>
    <text x="16" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#64748B">Animations de mots, presets de styles,</text>
    <text x="16" y="83" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#64748B">captions automatiques percutantes.</text>
  </g>

  <!-- Card 5: Effets & Export Pro -->
  <g transform="translate(565, 290)" filter="url(#floatCardShadow)">
    <rect width="215" height="96" rx="14" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5" />
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#EAF1FF" />
    <path d="M 31 22 L 34 28 L 40 29 L 36 34 L 37 40 L 31 37 L 25 40 L 26 34 L 22 29 L 28 28 Z" fill="#2563EB" />
    <text x="58" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#2563EB" letter-spacing="1">MODULE 4</text>
    <text x="58" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#102A56">Bruitages &amp; Export Pro</text>
    <text x="16" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#64748B">Sound design immersif, colorimétrie</text>
    <text x="16" y="83" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#64748B">et réglages d'export haute qualité.</text>
  </g>

  <!-- Card 6: Badge Pratique -->
  <g transform="translate(570, 420)" filter="url(#floatCardShadow)">
    <rect width="200" height="70" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="32" cy="35" r="16" fill="#10B981" opacity="0.2" />
    <path d="M 25 35 L 30 40 L 40 28" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="56" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#102A56">Méthode pas-à-pas</text>
    <text x="56" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#64748B">Accessible dès zéro</text>
  </g>

  <!-- CENTER: SMARTPHONE WITH CAPCUT TIMELINE -->
  <g transform="translate(265, 30)" filter="url(#phoneShadow)">
    <!-- Phone Outer Shell -->
    <rect width="270" height="550" rx="42" fill="url(#phoneBody)" stroke="#334155" stroke-width="3" />
    <!-- Outer rim shine -->
    <rect x="4" y="4" width="262" height="542" rx="38" fill="none" stroke="#64748B" stroke-width="1" opacity="0.4" />
    
    <!-- Phone Screen -->
    <rect x="10" y="10" width="250" height="530" rx="34" fill="url(#screenGrad)" />

    <!-- Dynamic Island / Top Speaker Pill -->
    <rect x="90" y="18" width="90" height="20" rx="10" fill="#000000" />
    <circle cx="165" cy="28" r="4.5" fill="#1E293B" />
    <circle cx="165" cy="28" r="2" fill="#2563EB" />

    <!-- Top CapCut Status Bar -->
    <text x="24" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">9:41</text>
    <text x="230" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="end">1080P ▾</text>

    <!-- Top App Bar in CapCut -->
    <g transform="translate(18, 48)">
      <text x="4" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94A3B8">✕</text>
      <!-- Export button top right -->
      <rect x="156" y="0" width="70" height="22" rx="11" fill="url(#capcutAccent)" />
      <text x="191" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">Exporter ↗</text>
    </g>

    <!-- Video Preview Viewport (9:16 area inside phone) -->
    <g transform="translate(20, 78)">
      <rect width="230" height="230" rx="12" fill="url(#videoGrad)" stroke="#1E293B" stroke-width="1" />
      <!-- Content inside video preview -->
      <circle cx="115" cy="90" r="38" fill="#FFFFFF" opacity="0.2" />
      <circle cx="115" cy="85" r="24" fill="#FFFFFF" opacity="0.9" />
      <path d="M 85 145 C 85 115, 145 115, 145 145 Z" fill="#FFFFFF" opacity="0.9" />
      <!-- Animated Caption Badge on Video -->
      <rect x="35" y="165" width="160" height="32" rx="8" fill="#000000" opacity="0.75" />
      <text x="115" y="186" font-family="'Impact', sans-serif" font-size="15" fill="#FACC15" text-anchor="middle" letter-spacing="1">MONTAGE SMARTPHONE</text>
      <!-- Timecode display -->
      <rect x="12" y="12" width="60" height="18" rx="4" fill="#000000" opacity="0.6" />
      <text x="42" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">00:04 / 00:15</text>
    </g>

    <!-- Playback control icons bar -->
    <g transform="translate(20, 318)">
      <circle cx="115" cy="12" r="14" fill="#2563EB" />
      <polygon points="112,6 122,12 112,18" fill="#FFFFFF" />
      <text x="20" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">↺ Annuler</text>
      <text x="210" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">Plein écran ⛶</text>
    </g>

    <!-- CAPCUT TIMELINE TRACKS -->
    <g transform="translate(16, 348)">
      <rect width="238" height="125" rx="8" fill="#131B2E" stroke="#1E293B" />
      
      <!-- Center playhead white line -->
      <line x1="119" y1="4" x2="119" y2="120" stroke="#FFFFFF" stroke-width="2" />
      <polygon points="115,4 123,4 119,10" fill="#FFFFFF" />

      <!-- Video Clip Track 1 -->
      <g transform="translate(6, 12)">
        <rect x="0" y="0" width="70" height="30" rx="4" fill="#3B82F6" stroke="#60A5FA" stroke-width="1" />
        <text x="35" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">Clip 1</text>
        <line x1="72" y1="0" x2="72" y2="30" stroke="#00E5FF" stroke-width="2" />
        <!-- Clip 2 (Active under playhead) -->
        <rect x="74" y="0" width="90" height="30" rx="4" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5" />
        <text x="119" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">Clip 2 (Cut)</text>
        <!-- Clip 3 -->
        <rect x="166" y="0" width="60" height="30" rx="4" fill="#1D4ED8" stroke="#3B82F6" stroke-width="1" />
        <text x="196" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">Clip 3</text>
      </g>

      <!-- Text / Subtitle Track 2 -->
      <g transform="translate(6, 48)">
        <rect x="25" y="0" width="55" height="18" rx="3" fill="#EAB308" />
        <text x="52" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="800" fill="#000000" text-anchor="middle">TITRE 1</text>
        <rect x="85" y="0" width="75" height="18" rx="3" fill="#FACC15" stroke="#FFFFFF" stroke-width="1" />
        <text x="122" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="800" fill="#000000" text-anchor="middle">SOUS-TITRES</text>
        <rect x="165" y="0" width="50" height="18" rx="3" fill="#EAB308" />
        <text x="190" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="800" fill="#000000" text-anchor="middle">OUTRO</text>
      </g>

      <!-- Audio / Music Track 3 -->
      <g transform="translate(6, 72)">
        <rect x="10" y="0" width="214" height="18" rx="3" fill="#059669" opacity="0.9" />
        <text x="18" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF">♫ Musique Beat Sync (Bass)</text>
        <!-- Audio waveform dots -->
        <g fill="#A7F3D0" opacity="0.8">
          <circle cx="130" cy="9" r="1.5" />
          <circle cx="138" cy="9" r="2.5" />
          <circle cx="146" cy="9" r="1.5" />
          <circle cx="154" cy="9" r="3" />
          <circle cx="162" cy="9" r="2" />
          <circle cx="170" cy="9" r="2.5" />
          <circle cx="178" cy="9" r="1" />
        </g>
      </g>

      <!-- Sound Effects Track 4 -->
      <g transform="translate(6, 96)">
        <rect x="70" y="0" width="30" height="16" rx="3" fill="#8B5CF6" />
        <text x="85" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">Whoosh</text>
        <rect x="150" y="0" width="25" height="16" rx="3" fill="#8B5CF6" />
        <text x="162" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">Pop</text>
      </g>
    </g>

    <!-- Bottom CapCut Navigation Toolbar -->
    <g transform="translate(18, 488)">
      <rect width="234" height="34" rx="6" fill="#0B1324" />
      <text x="24" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#CBD5E1">✂ Modifier</text>
      <text x="76" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#CBD5E1">♫ Audio</text>
      <text x="120" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#00E5FF" font-weight="700">T Texte</text>
      <text x="165" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#CBD5E1">★ Effets</text>
      <text x="208" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#CBD5E1">Filters</text>
    </g>
  </g>
</svg>
